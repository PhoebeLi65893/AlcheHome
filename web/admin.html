<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alche Home Ops</title>
<style>
body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f8f9fa;color:#2c3e50;margin:0}
main{max-width:860px;margin:30px auto;background:#fff;padding:28px;border-radius:12px;box-shadow:0 10px 25px rgba(0,0,0,.06)}
h1{color:#2b5c8f;margin:0 0 6px}
button,input,select{font:inherit;padding:8px 12px;border-radius:6px;border:1px solid #cbd5e1;box-sizing:border-box}
button{background:#2b5c8f;color:#fff;border:none;cursor:pointer;font-weight:600}
button.alt{background:#fff;color:#2b5c8f;border:1px solid #2b5c8f}
button:hover{opacity:.9}button:disabled{opacity:.5;cursor:default}
#msg{color:#b42318;min-height:1.4em;margin:4px 0}
#login input{display:block;width:100%;margin:6px 0}
.hide{display:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.top .actions{display:flex;gap:8px;align-items:center}
.ticket{border:1px solid #e2e8f0;border-left:4px solid #b42318;border-radius:8px;padding:12px 14px;margin:10px 0}
.ticket.MATCHING{border-left-color:#2b5c8f}
.ticket .head{display:flex;justify-content:space-between;gap:8px;font-weight:700;color:#2b5c8f;flex-wrap:wrap}
.ticket .meta{color:#64748b;font-size:.88rem;margin:4px 0}
.ticket .summary{margin:6px 0}
.ticket .buttons{display:flex;gap:8px;margin-top:8px}
table{border-collapse:collapse;width:100%;margin-top:10px;font-size:.9rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #e2e8f0}
th{color:#64748b;font-weight:600}
.dim{color:#94a3b8}
.ok{color:#15803d;font-weight:600}
.empty{color:#94a3b8;text-align:center;margin:30px 0}
.tabs{display:flex;gap:6px;margin:6px 0 10px}
.tab{background:#fff;color:#2b5c8f;border:1px solid #2b5c8f}
.tab.active{background:#2b5c8f;color:#fff}
.addbox{border:1px dashed #94a3b8;border-radius:8px;padding:10px 12px;margin-bottom:12px}
.addbox .row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.addbox input{flex:1;min-width:160px}
.invite{word-break:break-all;background:#f1f5f9;padding:8px;border-radius:6px;font-size:.85rem}
.pill{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:10px;background:#fef3c7;color:#92400e}
.pill.APPROVED{background:#dcfce7;color:#166534}
</style>
</head>
<body>
<main>
<h1>Alche Home Ops</h1>
<p id="msg"></p>

<section id="login">
  <p>Sign in with an admin account (see <code>python -m scripts.make_admin</code>).</p>
  <input id="email" type="email" placeholder="Email" autocomplete="username">
  <input id="password" type="password" placeholder="Password" autocomplete="current-password">
  <button onclick="signIn()">Log in</button>
</section>

<section id="panel" class="hide">
  <div class="top">
    <span><strong id="who"></strong></span>
    <span class="actions">
      <select id="status" onchange="load()">
        <option value="UNMATCHED">Unmatched</option>
        <option value="MATCHING">Waiting for a reply (matching)</option>
      </select>
      <button class="alt" onclick="load()">Refresh</button>
      <button class="alt" onclick="signOut()">Log out</button>
    </span>
  </div>
  <div class="tabs">
    <button id="tabTickets" class="tab active" onclick="setView('tickets')">Tickets</button>
    <button id="tabHandymen" class="tab" onclick="setView('handymen')">Handymen</button>
  </div>
  <div id="tickets"></div>
  <div id="handymen" class="hide">
    <div class="addbox">
      <strong>Add a handyman</strong>
      <div class="row">
        <input id="newEmail" type="email" placeholder="Email">
        <input id="newName" type="text" placeholder="Display name" maxlength="40">
        <button onclick="addHandyman()">Create and get invite link</button>
      </div>
      <p id="inviteOut" class="invite hide"></p>
    </div>
    <div id="handymenList"></div>
  </div>
</section>
</main>

<script src="i18n.js?v=16"></script>
<script>
// Dev-only: tokens live in sessionStorage, like the customer page.
const API = window.API_BASE || 'http://localhost:8000';
const $ = id => document.getElementById(id);
const msg = t => { $('msg').textContent = t || ''; };
const store = {
  get: k => sessionStorage.getItem(k),
  set: (k, v) => sessionStorage.setItem(k, v),
  clear: () => sessionStorage.clear()
};

async function api(path, opts = {}) {
  const res = await fetch(API + path, opts);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    const d = body && body.detail;
    throw Object.assign(new Error(typeof d === 'string' ? I18N.err(d) : _('Request failed')), { status: res.status });
  }
  return body;
}

async function authed(path, opts = {}, retried = false) {
  const headers = { ...(opts.headers || {}), Authorization: 'Bearer ' + store.get('access') };
  try {
    return await api(path, { ...opts, headers });
  } catch (e) {
    if (e.status === 401 && store.get('refresh') && !retried) {
      const t = await api('/auth/refresh', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: store.get('refresh') })
      });
      store.set('access', t.access_token); store.set('refresh', t.refresh_token);
      return authed(path, opts, true);
    }
    throw e;
  }
}

// Build elements with textContent only: ticket summaries are written by customers.
function el(tag, props = {}, ...kids) {
  const n = Object.assign(document.createElement(tag), props);
  kids.flat().forEach(k => n.append(k));
  return n;
}

async function signIn() {
  msg('');
  try {
    const t = await api('/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: $('email').value.trim(), password: $('password').value })
    });
    store.set('access', t.access_token); store.set('refresh', t.refresh_token);
    $('password').value = '';
    await showPanel();
  } catch (e) { msg(e.status === 401 ? _('Could not log in.') : e.message); }
}

function signOut() {
  store.clear();
  $('panel').classList.add('hide'); $('login').classList.remove('hide');
  msg('');
}

async function showPanel() {
  const me = await authed('/me');
  if (me.role !== 'ADMIN') { store.clear(); msg(_('This account is not an admin.')); return; }
  $('who').textContent = me.email || me.id;
  I18N.adopt(me.language);
  $('login').classList.add('hide'); $('panel').classList.remove('hide');
  await load();
}

// ---- handymen: add, invite, approve ----
function setView(v) {
  $('tickets').classList.toggle('hide', v !== 'tickets');
  $('handymen').classList.toggle('hide', v !== 'handymen');
  $('tabTickets').classList.toggle('active', v === 'tickets');
  $('tabHandymen').classList.toggle('active', v === 'handymen');
  $('status').classList.toggle('hide', v !== 'tickets');
  if (v === 'handymen') loadHandymen(); else load();
}

async function loadHandymen() {
  msg('');
  try {
    const list = await authed('/admin/handymen');
    $('handymenList').replaceChildren(...(list.length ? list.map(handymanRow)
      : [el('p', { className: 'empty', textContent: _('No handymen yet.') })]));
  } catch (e) { msg(e.message); }
}

function handymanRow(h) {
  const actions = el('div', { className: 'buttons' });
  if (h.status === 'PENDING') {
    const ok = el('button', { textContent: _('Approve'), onclick: () => act(h, 'approve') });
    ok.disabled = !h.complete;
    ok.title = h.complete ? '' : _('The profile needs expertise and a ZIP code first');
    actions.append(ok);
  } else {
    actions.append(el('button', { className: 'alt', textContent: _('Suspend'), onclick: () => act(h, 'suspend') }));
  }
  actions.append(el('button', { className: 'alt', textContent: _('New invite link'), onclick: () => invite(h) }));
  return el('div', { className: 'ticket ' + (h.status === 'APPROVED' ? 'MATCHING' : '') },
    el('div', { className: 'head' },
      el('span', { textContent: h.display_name }),
      el('span', { className: 'pill ' + h.status, textContent: _(h.status) })),
    el('div', { className: 'meta', textContent:
      [h.email || _('no email'), h.phone || _('no phone'), h.has_password ? _('has password') : _('invite not used yet'),
       h.is_available ? _('available') : _('on break')].join(' · ') }),
    el('p', { className: 'summary', textContent:
      _('Expertise: {skills} · ZIPs: {zips}', {
        skills: h.skills.map(s => _(s)).join(', ') || _('none yet'),
        zips: h.service_zips.join(', ') || _('none yet') }) }),
    actions);
}

async function act(h, what) {
  try {
    await authed(`/admin/handymen/${h.handyman_id}/${what}`, { method: 'POST' });
    await loadHandymen();
  } catch (e) { msg(e.message); }
}

function showInvite(url) {
  const p = $('inviteOut');
  p.textContent = _('Send this link to the handyman (works once, valid 7 days): {url}', { url });
  p.classList.remove('hide');
}

async function invite(h) {
  try {
    const r = await authed(`/admin/handymen/${h.handyman_id}/invite`, { method: 'POST' });
    showInvite(r.invite_url);
    window.scrollTo(0, 0);
  } catch (e) { msg(e.message); }
}

async function addHandyman() {
  msg('');
  try {
    const r = await authed('/admin/handymen', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: $('newEmail').value.trim(), display_name: $('newName').value.trim() })
    });
    showInvite(r.invite_url);
    $('newEmail').value = ''; $('newName').value = '';
    await loadHandymen();
  } catch (e) { msg(e.status === 422 ? _('Enter a valid email and a name of at least 2 characters.') : e.message); }
}

async function load() {
  msg('');
  const box = $('tickets');
  try {
    const list = await authed('/admin/tickets?status=' + $('status').value);
    box.replaceChildren(...(list.length ? list.map(ticketView)
      : [el('p', { className: 'empty', textContent: _('No tickets here. Nice.') })]));
  } catch (e) { msg(e.message); }
}

function ticketView(t) {
  const detail = el('div');
  const card = el('div', { className: 'ticket ' + t.status },
    el('div', { className: 'head' },
      el('span', { textContent: `#${t.number} · ${_(t.category)} · ${_(t.urgency)}` }),
      el('span', { textContent: `${_('ZIP')} ${t.location_zip}` })),
    el('div', { className: 'meta', textContent:
      _('{status} · waiting {mins} min · {offers} offer(s) sent', { status: _(t.status), mins: t.waiting_minutes, offers: t.offers }) }),
    el('p', { className: 'summary', textContent: t.issue_summary }),
    el('div', { className: 'buttons' },
      el('button', { textContent: _('Choose handyman'), onclick: () => chooser(t, detail) }),
      t.status === 'UNMATCHED'
        ? el('button', { className: 'alt', textContent: _('Retry automatic dispatch'),
            onclick: () => retry(t) }) : ''),
    detail);
  return card;
}

async function chooser(t, box) {
  try {
    const list = await authed(`/admin/tickets/${t.id}/handymen`);
    if (!list.length) { box.replaceChildren(el('p', { className: 'dim', textContent: _('Nobody has this skill.') })); return; }
    const head = el('tr', {}, ...['Handyman', 'Score', 'Covers ZIP', 'Available', 'Rating', 'Response', 'Earlier offer', '']
      .map(h => el('th', { textContent: h ? _(h) : h })));
    const rows = list.map(h => el('tr', {},
      el('td', { textContent: h.display_name }),
      el('td', h.score === null ? { className: 'dim', textContent: 'n/a' } : { className: 'ok', textContent: h.score.toFixed(3) }),
      el('td', { textContent: h.covers_zip ? _('yes') : _('no') }),
      el('td', { textContent: h.is_available ? _('yes') : _('no') }),
      el('td', { textContent: h.rating_avg.toFixed(1) }),
      el('td', { textContent: Math.round(h.response_rate * 100) + '%' }),
      el('td', { textContent: h.already_offered ? _(h.already_offered) : '' }),
      el('td', {}, el('button', { textContent: _('Assign'), onclick: () => assign(t, h) }))));
    box.replaceChildren(el('table', {}, el('thead', {}, head), el('tbody', {}, rows)));
  } catch (e) { msg(e.message); }
}

async function assign(t, h) {
  const warn = h.score === null ? _(' They do not cover this ZIP or are unavailable.') : '';
  if (!confirm(_('Assign {name} to #{n}?{warn}', { name: h.display_name, n: t.number, warn }))) return;
  try {
    await authed(`/admin/tickets/${t.id}/assign`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ handyman_id: h.handyman_id })
    });
    await load();
    msg(_('#{n} assigned to {name}.', { n: t.number, name: h.display_name }));
  } catch (e) { msg(e.message); }
}

async function retry(t) {
  try {
    const r = await authed(`/admin/tickets/${t.id}/retry`, { method: 'POST' });
    await load();
    msg(r.started ? _('Dispatch restarted for #{n}.', { n: t.number }) : _('Ticket is no longer UNMATCHED.'));
  } catch (e) { msg(e.message); }
}

// Switching language: save it on the account and redraw what the script built.
I18N.persist = async l => {
  if (!store.get('access')) return;
  try { await authed('/me/language', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ language: l }) }); }
  catch (e) { /* the choice still applies in this browser */ }
};
I18N.onChange(() => {
  if ($('panel').classList.contains('hide')) return;
  if ($('handymen').classList.contains('hide')) load(); else loadHandymen();
});

(function init() {
  if (store.get('access')) showPanel().catch(() => signOut());
})();
</script>
</body>
</html>
