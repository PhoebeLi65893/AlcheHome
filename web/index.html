<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alche Home</title>
<link rel="stylesheet" href="messages.css?v=16">
<style>
body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f8f9fa;color:#2c3e50;margin:0}
main{max-width:620px;margin:40px auto;background:#fff;padding:28px;border-radius:12px;box-shadow:0 10px 25px rgba(0,0,0,.06)}
h1{color:#2b5c8f;margin:0 0 6px}
button,input{font:inherit;padding:10px 14px;border-radius:6px;border:1px solid #cbd5e1;width:100%;box-sizing:border-box;margin:4px 0}
button{background:#2b5c8f;color:#fff;border:none;cursor:pointer;font-weight:600}
button.alt{background:#fff;color:#2b5c8f;border:1px solid #2b5c8f}
button:hover{opacity:.9}button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px}.row button{width:auto;flex:1}
#msg{color:#b42318;min-height:1.4em;margin:4px 0}
pre{background:#f1f5f9;padding:12px;border-radius:6px;overflow:auto;font-size:.85rem}
hr{border:none;border-top:1px solid #e2e8f0;margin:18px 0}
.hide{display:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top button{width:auto;margin:0}
details{margin:10px 0}summary{cursor:pointer;color:#2b5c8f;font-weight:600}
#chat{height:340px;overflow-y:auto;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.bubble{max-width:80%;padding:8px 12px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.USER{align-self:flex-end;background:#2b5c8f;color:#fff;border-bottom-right-radius:4px}
.BOT{align-self:flex-start;background:#e8edf3;border-bottom-left-radius:4px}
.ticket{margin-top:8px;background:#fff;color:#2c3e50;border:1px solid #cbd5e1;border-left:4px solid #2b5c8f;border-radius:8px;padding:10px 12px;font-weight:400;white-space:normal}
.ticket .head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;color:#2b5c8f}
.ticket .status{font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:10px;background:#e8f0f9;color:#2b5c8f}
.ticket .status.CANCELLED{background:#f1f5f9;color:#64748b}
.ticket dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:8px 0 0;font-size:.88rem}
.ticket dt{color:#64748b}.ticket dd{margin:0}
.ticket .summary{margin:6px 0 0;font-size:.92rem}
.ticket button{width:auto;margin:8px 0 0;padding:6px 12px;font-size:.85rem}
.top{flex-wrap:wrap}
.top .actions{display:flex;gap:8px;flex-wrap:wrap}
.top button{white-space:nowrap}
.tabs{display:flex;gap:6px;margin:10px 0}
.tab{width:auto;margin:0;background:#fff;color:#2b5c8f;border:1px solid #2b5c8f}
.tab.active{background:#2b5c8f;color:#fff}
.tab .badge{margin-left:4px}
.picker{margin-top:10px;border-top:1px solid #e2e8f0;padding-top:8px}
.picker .hint{margin:0 0 6px;font-size:.85rem;color:#64748b}
.picker .buttons{display:flex;gap:8px;flex-wrap:wrap}
.picker .opt{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f1f5f9;font-size:.88rem}
.picker .opt button{margin:0}
.thread{max-height:160px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
.tmsg{padding:5px 9px;border-radius:10px;font-size:.88rem;max-width:90%;word-wrap:break-word}
.tmsg.CUSTOMER{align-self:flex-end;background:#2b5c8f;color:#fff}
.tmsg.HANDYMAN{align-self:flex-start;background:#e8edf3}
.picker .buttons input{flex:1;margin:0;width:auto;min-width:0}
.picker .star{color:#15803d;font-weight:700;font-size:.75rem}
.EMERGENCY{background:#fdecea;border:2px solid #b42318;color:#7a1b12;font-weight:600;max-width:95%}
.pending{opacity:.6;font-style:italic}
.empty{color:#94a3b8;text-align:center;margin:auto}
#composer{display:flex;gap:8px;margin-top:10px}
#composer input{margin:0}#composer button{width:90px;margin:0}
#composer button.alt{width:auto;padding:10px 12px}
.photos{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.photos img{max-width:180px;max-height:180px;border-radius:8px;display:block;background:#cbd5e1;cursor:zoom-in}
.photos img.broken{width:120px;height:80px}
#previews{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
#previews:empty{display:none}
.preview{position:relative}
.preview img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid #cbd5e1;display:block}
.preview button{position:absolute;top:-8px;right:-8px;width:22px;height:22px;padding:0;margin:0;border-radius:50%;font-size:14px;line-height:22px}
</style>
</head>
<body>
<main>
<h1>Alche Home</h1>
<p id="msg"></p>

<section id="signedOut">
  <button onclick="location.href=API+'/auth/google/login'">Sign in with Google</button>
  <button class="alt" onclick="location.href=API+'/auth/facebook/login'">Sign in with Facebook</button>
  <hr>
  <input id="email" type="email" placeholder="Email" autocomplete="username">
  <input id="password" type="password" placeholder="Password (10+ characters)" autocomplete="current-password">
  <div class="row">
    <button onclick="emailAuth('login')">Log in</button>
    <button class="alt" onclick="emailAuth('register')">Register</button>
  </div>
</section>

<section id="signedIn" class="hide">
  <div class="top"><span id="who"></span><span class="actions"><button id="create" onclick="createRequest()" title="Turn this chat into a repair request">Create request</button><button class="alt" onclick="newRequest()" title="Start over for a different problem">New request</button><button class="alt" onclick="logout()">Log out</button></span></div>
  <details>
    <summary>Profile (GET /me)</summary>
    <pre id="profile"></pre>
    <button class="alt" onclick="refreshNow()">Refresh token</button>
  </details>
  <div class="tabs">
    <button id="tabChat" class="tab active" onclick="showTab('chat')">Assistant</button>
    <button id="tabMsgs" class="tab" onclick="showTab('msgs')">Messages <span id="msgBadge" class="badge hide"></span></button>
    <button id="tabProfile" class="tab" onclick="showTab('profile')">My profile</button>
  </div>
  <div id="paneProfile" class="hide">
    <label for="cName">Your name</label>
    <input id="cName" type="text" maxlength="60" autocomplete="name">
    <label for="cZip">Home ZIP code (used for new requests, so we do not have to ask)</label>
    <input id="cZip" type="text" inputmode="numeric" maxlength="5" placeholder="92101" autocomplete="postal-code">
    <button id="cSave" onclick="saveCustomerProfile()">Save profile</button>
    <hr>
    <label for="cNewPhone">Phone number (confirmed with a code we text you)</label>
    <p id="cPhone" class="hint"></p>
    <div class="row">
      <input id="cNewPhone" type="tel" placeholder="+16195550199" autocomplete="tel">
      <button class="alt" id="cSendCode" onclick="sendCustomerCode()">Send code</button>
    </div>
    <div class="row hide" id="cCodeRow">
      <input id="cCode" type="text" inputmode="numeric" maxlength="8" placeholder="6-digit code" autocomplete="one-time-code">
      <button id="cVerify" onclick="verifyCustomerCode()">Confirm</button>
    </div>
    <p id="cCodeHint" class="hint"></p>
  </div>
  <div id="paneMsgs" class="hide"><div id="msgsRoot"></div></div>
  <div id="paneChat">
  <div id="chat" aria-live="polite"></div>
  <div id="previews"></div>
  <div id="composer">
    <input id="file" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
    <button class="alt" type="button" onclick="$('file').click()" title="Attach photos (up to 3)">Photo</button>
    <input id="text" type="text" maxlength="4000" placeholder="Describe your home repair problem..." autocomplete="off">
    <button id="send" onclick="sendMessage()">Send</button>
  </div>
  </div>
</section>
</main>

<script src="config.js?v=17"></script>
<script src="i18n.js?v=16"></script>
<script src="messages.js?v=16"></script>
<script>
// Dev-only: tokens live in sessionStorage. Production will use a safer scheme.
const API = window.API_BASE || 'http://localhost:8000';
const $ = id => document.getElementById(id);
const msg = t => { $('msg').textContent = t || ''; };
const store = {
  get: k => sessionStorage.getItem(k),
  set: (k, v) => sessionStorage.setItem(k, v),
  clear: () => sessionStorage.clear()
};
const JSON_HEADERS = { 'Content-Type': 'application/json' };

function saveTokens(t) {
  store.set('access', t.access_token);
  store.set('refresh', t.refresh_token);
}

async function api(path, opts = {}) {
  const res = await fetch(API + path, opts);
  const body = res.status === 204 ? null : await res.json().catch(() => ({}));
  if (!res.ok) {
    const d = body && body.detail;
    throw Object.assign(new Error(typeof d === 'string' ? I18N.err(d) : _('Request failed')), { status: res.status });
  }
  return body;
}

// Calls the API with the access token; on 401 refreshes once and retries.
async function authed(path, opts = {}, retried = false) {
  const headers = { ...(opts.headers || {}), Authorization: 'Bearer ' + store.get('access') };
  try {
    return await api(path, { ...opts, headers });
  } catch (e) {
    if (e.status === 401 && store.get('refresh') && !retried) {
      await doRefresh();
      return authed(path, opts, true);
    }
    throw e;
  }
}

async function doRefresh() {
  saveTokens(await api('/auth/refresh', {
    method: 'POST', headers: JSON_HEADERS,
    body: JSON.stringify({ refresh_token: store.get('refresh') })
  }));
}

async function emailAuth(kind) {
  msg();
  try {
    saveTokens(await api('/auth/' + kind, {
      method: 'POST', headers: JSON_HEADERS,
      body: JSON.stringify({ email: $('email').value, password: $('password').value })
    }));
    await showApp();
  } catch (e) { msg(e.message); }
}

async function refreshNow() {
  try { await doRefresh(); await loadProfile(); msg(_('Token refreshed')); }
  catch (e) { signOutLocally(_('Session expired, please sign in again')); }
}

async function loadProfile() {
  const me = await authed('/me');
  $('profile').textContent = JSON.stringify(me, null, 2);
  $('who').textContent = me.display_name || me.email || _('Signed in');
  I18N.adopt(me.language);   // the language saved on the account wins over the browser's
}

const MAX_PHOTOS = 3, MAX_PHOTO_MB = 10;
let pendingFiles = [];
const photoUrls = {};   // upload id -> object URL, so each photo is downloaded once

// <img> can't send our Authorization header, so photos are fetched with it and shown as blobs.
async function photoUrl(id, retried = false) {
  if (photoUrls[id]) return photoUrls[id];
  const res = await fetch(API + '/media/' + id, { headers: { Authorization: 'Bearer ' + store.get('access') } });
  if (res.status === 401 && !retried && store.get('refresh')) { await doRefresh(); return photoUrl(id, true); }
  if (!res.ok) throw new Error('Photo unavailable');
  return (photoUrls[id] = URL.createObjectURL(await res.blob()));
}

function addPhotos(bubble, sources) {
  const wrap = document.createElement('div');
  wrap.className = 'photos';
  sources.forEach(src => {
    const img = document.createElement('img');
    img.alt = _('Attached photo');
    wrap.appendChild(img);
    if (src.url) img.src = src.url;
    else photoUrl(src.id).then(u => { img.src = u; }).catch(() => { img.classList.add('broken'); img.alt = _('Photo unavailable'); });
    img.onclick = () => { if (img.src) window.open(img.src, '_blank'); };
  });
  bubble.prepend(wrap);
}

const LABELS = {
  PLUMBING: 'Plumbing', ELECTRICAL: 'Electrical', HVAC: 'Heating / cooling', CARPENTRY: 'Carpentry',
  APPLIANCE: 'Appliance', GENERAL: 'General repair', EMERGENCY: 'Emergency', SAME_DAY: 'Today',
  FLEXIBLE: 'Flexible', LOW: 'Low', MEDIUM: 'Medium', HIGH: 'High'
};
const label = v => _(String(v));
const CANCELLABLE = ['DRAFT', 'OPEN', 'MATCHING', 'UNMATCHED', 'ASSIGNED', 'IN_PROGRESS'];

// Built with textContent only, so nothing from the ticket is interpreted as HTML.
function ticketCard(t) {
  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
  const card = el('div', 'ticket');
  const head = el('div', 'head');
  head.append(el('span', null, _('Repair request #{n}', { n: t.number })), el('span', 'status ' + t.status, _(t.status)));
  const dl = el('dl');
  [[_('Type'), label(t.category)], [_('When'), label(t.urgency)], [_('ZIP'), t.location_zip]]
    .concat(t.severity ? [[_('Severity'), label(t.severity)]] : [])
    .forEach(([k, v]) => dl.append(el('dt', null, k), el('dd', null, v)));
  const sum = el('p', 'summary', t.issue_summary);
  sum.setAttribute('data-notranslate', '');   // the customer's own words
  card.append(head, sum, dl);
  if (CANCELLABLE.includes(t.status)) {
    const b = el('button', 'alt', _('Cancel request'));
    b.onclick = async () => {
      if (!confirm(_('Cancel repair request #{n}?', { n: t.number }))) return;
      b.disabled = true;
      try { card.replaceWith(ticketCard(await authed('/tickets/' + t.id + '/cancel', { method: 'POST' }))); }
      catch (e) { msg(e.message); b.disabled = false; }
    };
    card.append(b);
  }
  if (t.status === 'OPEN') card.append(handymanPicker(t, card));
  else if (t.status === 'UNMATCHED') card.append(el('p', 'summary', _('No handyman is available for ZIP {zip} right now. Our team has been alerted and will follow up here.', { zip: t.location_zip })));
  else if (t.status === 'MATCHING') {
    const p = el('p', 'summary', _('Looking for a handyman. This can take a few minutes.'));
    card.append(p);
    watchTicket(t, card, p);
  } else if (t.status === 'ASSIGNED' || t.status === 'IN_PROGRESS') {
    const who = el('p', 'summary', t.handyman_name ? _('{name} has accepted your request.', { name: t.handyman_name }) : _('A handyman has accepted your request.'));
    const phone = el('p', 'summary');
    const m = el('button', null, _('Message {name}', { name: t.handyman_name || _('your handyman') }));
    m.onclick = () => { showTab('msgs'); msgs.open(t.id); };
    card.append(who, phone, m);
    // The card from the chat history has no handyman details; load them (name, and number if shared).
    authed('/tickets/' + t.id).then(d => {
      if (d.handyman_name) {
        who.textContent = _('{name} has accepted your request.', { name: d.handyman_name });
        m.textContent = _('Message {name}', { name: d.handyman_name });
      }
      if (d.handyman_phone) {
        const a = document.createElement('a');
        a.href = 'tel:' + d.handyman_phone;
        a.textContent = d.handyman_phone;
        phone.append(_('Phone: {phone}', { phone: '' }), a);
      }
    }).catch(() => {});
  }
  return card;
}


// While we are looking for a handyman, show progress and update the card when something changes.
function watchTicket(t, card, p) {
  // The card is not on the page yet when this first runs, so only later ticks may stop on that.
  const tick = async (first) => {
    if (first !== true && !card.isConnected) return clearInterval(timer);
    try {
      const d = await authed('/tickets/' + t.id);
      if (d.status !== 'MATCHING') {
        clearInterval(timer);
        await loadChat();             // the status message from the assistant is in the chat now
        return;
      }
      let txt = _('Looking for a handyman.');
      if (d.offers_sent) {
        txt += _(' Asked {n} of up to {max}.', { n: d.offers_sent, max: d.max_offers });
        if (d.offer_expires_at) {
          const mins = Math.max(0, Math.ceil((new Date(d.offer_expires_at) - Date.now()) / 60000));
          txt += _(' Waiting for a reply ({mins} min left before we ask the next one).', { mins });
        }
      }
      p.textContent = txt;
    } catch (e) { /* keep trying; the next tick may work */ }
  };
  const timer = setInterval(tick, 5000);
  tick(true);
}

// Lets the customer pick a handyman, or have us pick (best ranked first, then the next, until one accepts).
function handymanPicker(t, card) {
  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
  const box = el('div', 'picker');
  const list = el('div');
  const start = async (handyman_id, btn) => {
    btn.disabled = true; msg();
    try {
      const body = JSON.stringify(handyman_id ? { handyman_id } : {});
      const updated = await authed('/tickets/' + t.id + '/dispatch', { method: 'POST', headers: JSON_HEADERS, body });
      card.replaceWith(ticketCard(updated));
      if (updated.status === 'UNMATCHED') msg(_('We could not find an available handyman for this request.'));
    } catch (e) { msg(e.message); btn.disabled = false; }
  };
  const auto = el('button', null, _('Find me a handyman'));
  auto.title = _('We ask the best match first, then the next, until someone accepts');
  auto.onclick = () => start(null, auto);
  const choose = el('button', 'alt', _('Choose a handyman'));
  choose.onclick = async () => {
    choose.disabled = true; msg();
    try {
      const opts = await authed('/tickets/' + t.id + '/handymen');
      list.replaceChildren(...(opts.length ? opts.map(o => {
        const row = el('div', 'opt');
        const info = el('span', null, _('{name} · {rating} stars · {rate}% reply rate ', { name: o.display_name, rating: o.rating_avg.toFixed(1), rate: Math.round(o.response_rate * 100) }));
        if (o.recommended) info.append(el('span', 'star', _('Best match')));
        const pick = el('button', 'alt', _('Choose'));
        pick.onclick = () => start(o.handyman_id, pick);
        row.append(info, pick);
        return row;
      }) : [el('p', 'hint', _('No handyman covers ZIP {zip} right now. Tap Find me a handyman and our team will follow up.', { zip: t.location_zip }))]));
    } catch (e) { msg(e.message); }
    choose.disabled = false;
  };
  const buttons = el('div', 'buttons');
  buttons.append(auto, choose);
  box.append(el('p', 'hint', _('Next: pick a handyman, or let us choose. If yours is busy we move on to the next best match.')), buttons, list);
  return box;
}

let msgs = null;
function showTab(which) {
  $('paneChat').classList.toggle('hide', which !== 'chat');
  $('paneMsgs').classList.toggle('hide', which !== 'msgs');
  $('paneProfile').classList.toggle('hide', which !== 'profile');
  $('tabChat').classList.toggle('active', which === 'chat');
  $('tabMsgs').classList.toggle('active', which === 'msgs');
  $('tabProfile').classList.toggle('active', which === 'profile');
  if (which === 'msgs' && msgs) msgs.refresh();
  if (which === 'profile') loadCustomerProfile();
}

// ---- my profile: name, home ZIP and a confirmed phone number ----
function showCustomerProfile(p) {
  $('cName').value = p.display_name || '';
  $('cZip').value = p.home_zip || '';
  $('cPhone').textContent = p.phone ? _('Current number: {phone}', { phone: p.phone }) : '';
}
async function loadCustomerProfile() {
  try { showCustomerProfile(await authed('/me/profile')); } catch (e) { msg(e.message); }
}
async function saveCustomerProfile() {
  $('cSave').disabled = true; msg();
  try {
    showCustomerProfile(await authed('/me/profile', {
      method: 'PUT', headers: JSON_HEADERS,
      body: JSON.stringify({ display_name: $('cName').value, home_zip: $('cZip').value })
    }));
    msg(_('Profile saved.'));
  } catch (e) { msg(e.status === 422 ? _('Enter a 5-digit ZIP code.') : e.message); }
  $('cSave').disabled = false;
}
async function sendCustomerCode() {
  $('cSendCode').disabled = true; msg();
  try {
    const r = await authed('/me/profile/phone', { method: 'POST', headers: JSON_HEADERS, body: JSON.stringify({ phone: $('cNewPhone').value }) });
    $('cCodeRow').classList.remove('hide');
    $('cCodeHint').textContent = _('We texted a code to {to} (valid {mins} minutes).', { to: r.sent_to, mins: r.expires_in_minutes }) +
      (r.dev_code ? _(' Local testing code: {code}', { code: r.dev_code }) : '');
  } catch (e) { msg(e.status === 422 ? _('Enter the number like +16195550199.') : e.message); }
  $('cSendCode').disabled = false;
}
async function verifyCustomerCode() {
  $('cVerify').disabled = true; msg();
  try {
    showCustomerProfile(await authed('/me/profile/phone/verify', { method: 'POST', headers: JSON_HEADERS, body: JSON.stringify({ code: $('cCode').value }) }));
    $('cCodeRow').classList.add('hide'); $('cCodeHint').textContent = ''; $('cNewPhone').value = ''; $('cCode').value = '';
    msg(_('Phone number confirmed.'));
  } catch (e) { msg(e.message); }
  $('cVerify').disabled = false;
}

async function createRequest() {
  const btn = $('create');
  btn.disabled = true; msg();
  const thinking = addBubble({ sender: 'BOT', body: _('Working on your request...') }, 'pending');
  try {
    const data = await authed('/chat/request-ticket', { method: 'POST' });
    thinking.remove();
    data.messages.forEach(m => addBubble(m));
  } catch (e) { thinking.remove(); msg(e.message); }
  btn.disabled = false;
}

async function newRequest() {
  if (!confirm(_('Start a new request? This chat will be closed; existing repair requests are kept.'))) return;
  try { await authed('/chat/new', { method: 'POST' }); await loadChat(); msg(); }
  catch (e) { msg(e.message); }
}

function addBubble(m, extra, localUrls) {
  const empty = document.querySelector('#chat .empty');
  if (empty) empty.remove();
  const d = document.createElement('div');
  d.className = 'bubble ' + m.sender + (m.flag === 'EMERGENCY' ? ' EMERGENCY' : '') + (extra ? ' ' + extra : '');
  d.textContent = m.body;            // textContent: message text is never interpreted as HTML
  d.setAttribute('data-notranslate', '');
  if (localUrls && localUrls.length) addPhotos(d, localUrls.map(url => ({ url })));
  else if (m.media_ids && m.media_ids.length) addPhotos(d, m.media_ids.map(id => ({ id })));
  if (m.ticket) d.appendChild(ticketCard(m.ticket));
  $('chat').appendChild(d);
  $('chat').scrollTop = $('chat').scrollHeight;
  return d;
}

async function loadChat() {
  const data = await authed('/chat/messages');
  $('chat').innerHTML = '';
  if (!data.messages.length) {
    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = _('No messages yet. Describe the problem or attach a photo.');
    $('chat').appendChild(e);
  }
  data.messages.forEach(m => addBubble(m));
}

function renderPreviews() {
  const box = $('previews');
  box.innerHTML = '';
  pendingFiles.forEach((f, i) => {
    const p = document.createElement('div');
    p.className = 'preview';
    const img = document.createElement('img');
    img.src = f.url; img.alt = f.file.name;
    const x = document.createElement('button');
    x.type = 'button'; x.textContent = '\u00d7'; x.title = _('Remove');
    x.onclick = () => { URL.revokeObjectURL(f.url); pendingFiles.splice(i, 1); renderPreviews(); };
    p.append(img, x);
    box.appendChild(p);
  });
}

$('file').addEventListener('change', e => {
  msg();
  for (const file of e.target.files) {
    if (pendingFiles.length >= MAX_PHOTOS) { msg(_('You can attach up to {n} photos per message.', { n: MAX_PHOTOS })); break; }
    if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) { msg(_('{name}: only JPEG, PNG or WebP photos.', { name: file.name })); continue; }
    if (file.size > MAX_PHOTO_MB * 1024 * 1024) { msg(_('{name} is larger than {n} MB.', { name: file.name, n: MAX_PHOTO_MB })); continue; }
    pendingFiles.push({ file, url: URL.createObjectURL(file) });
  }
  e.target.value = '';                // allow choosing the same file again
  renderPreviews();
});

async function uploadPhoto(file) {
  const form = new FormData();
  form.append('file', file);
  return (await authed('/media', { method: 'POST', body: form })).id;
}

async function sendMessage() {
  const input = $('text'), body = input.value.trim();
  const files = pendingFiles.slice();
  if (!body && !files.length) return;
  $('send').disabled = true; msg();
  // Show the message and a "thinking" bubble right away; the real ones replace them.
  const mine = addBubble({ sender: 'USER', body }, 'pending', files.map(f => f.url));
  const thinking = addBubble({ sender: 'BOT', body: files.length ? _('Looking at your photo...') : _('Thinking...') }, 'pending');
  input.value = ''; pendingFiles = []; renderPreviews();
  try {
    const media_ids = [];
    for (const f of files) media_ids.push(await uploadPhoto(f.file));
    const data = await authed('/chat/messages', {
      method: 'POST', headers: JSON_HEADERS, body: JSON.stringify({ body, media_ids })
    });
    // Reuse the local previews for the photos we just sent.
    media_ids.forEach((id, i) => { photoUrls[id] = files[i].url; });
    mine.remove(); thinking.remove();
    data.messages.forEach(m => addBubble(m));
  } catch (e) {
    mine.remove(); thinking.remove();
    input.value = body;               // give the text and photos back so nothing is lost
    pendingFiles = files; renderPreviews();
    msg(e.message);
  }
  $('send').disabled = false; input.focus();
}

async function showApp() {
  try {
    await loadProfile();
    $('signedOut').classList.add('hide');
    $('signedIn').classList.remove('hide');
    await loadChat();
    if (msgs) msgs.stop();
    msgs = AlcheMessages.mount($('msgsRoot'), { authed, onUnread: n => {
      const b = $('msgBadge'); b.textContent = n; b.classList.toggle('hide', !n);
    } });
    I18N.apply();
    showTab('chat');
  } catch (e) {
    console.error('showApp failed', e);
    if (e.status === 401) signOutLocally(_('Please sign in again ({m})', { m: e.message }));
    else msg(_('Signed in, but loading failed: {m}', { m: e.message + (e.status ? ' (HTTP ' + e.status + ')' : '') }));
  }
}

async function logout() {
  try {
    await api('/auth/logout', {
      method: 'POST', headers: JSON_HEADERS,
      body: JSON.stringify({ refresh_token: store.get('refresh') })
    });
  } catch (e) { /* ignore */ }
  signOutLocally();
}

function signOutLocally(m) {
  store.clear();
  Object.values(photoUrls).forEach(u => URL.revokeObjectURL(u));
  for (const k in photoUrls) delete photoUrls[k];
  $('signedIn').classList.add('hide');
  $('signedOut').classList.remove('hide');
  msg(m);
}

$('text').addEventListener('keydown', e => {
  // Enter confirms a candidate in input methods (Chinese, Japanese...): do not send then.
  if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) sendMessage();
});

// Switching language: save it on the account and redraw what the script built.
I18N.persist = async l => {
  if (!store.get('access')) return;
  try { await authed('/me/language', { method: 'PUT', headers: JSON_HEADERS, body: JSON.stringify({ language: l }) }); }
  catch (e) { /* the choice still applies in this browser */ }
};
I18N.onChange(() => {
  if (store.get('access') && !$('signedIn').classList.contains('hide')) {
    loadChat().catch(() => {});
    if (msgs) msgs.relabel();
    if (!$('paneProfile').classList.contains('hide')) loadCustomerProfile();
  }
});

(function init() {
  const hadHash = location.hash.length > 1;
  const params = new URLSearchParams(location.hash.slice(1));
  history.replaceState(null, '', location.pathname);   // remove tokens from the address bar
  if (params.get('error')) {
    const map = { account_exists: _('An account with that email already exists. Use your original sign-in method.') };
    msg(map[params.get('error')] || _('Sign-in failed: {m}', { m: params.get('error') }));
  } else if (params.get('access_token')) {
    saveTokens({ access_token: params.get('access_token'), refresh_token: params.get('refresh_token') });
  }
  else if (hadHash) msg(_('Unexpected sign-in response: no tokens were returned'));
  console.log('init: hash present =', hadHash, '| has access token =', !!store.get('access'));
  if (store.get('access')) showApp();
})();
</script>
