name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-api:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: alche
          POSTGRES_PASSWORD: alche
          POSTGRES_DB: alche
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alche" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://alche:alche@localhost:5432/alche
    defaults:
      run:
        working-directory: core-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core-api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Migrate
        run: alembic upgrade head
      - name: Test
        run: pytest

  docker-build:
    runs-on: ubuntu-latest
    needs: core-api
    steps:
      - uses: actions/checkout@v4
      - name: Build core-api image
        run: docker build -t alche-core-api ./core-api
      - name: Smoke test /health
        run: |
          docker run -d --name api -p 8000:8000 alche-core-api
          for i in $(seq 1 15); do curl -fs localhost:8000/health && exit 0; sleep 2; done
          docker logs api; exit 1
