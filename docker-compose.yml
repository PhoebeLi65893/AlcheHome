services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: alche
      POSTGRES_PASSWORD: alche
      POSTGRES_DB: alche
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alche -d alche"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./core-api
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg://alche:alche@db:5432/alche
    depends_on:
      db:
        condition: service_healthy

  core-api:
    build: ./core-api
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql+psycopg://alche:alche@db:5432/alche
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
